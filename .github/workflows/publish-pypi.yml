name: Publish Python package

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate distributions
    if: ${{ startsWith(github.event.release.tag_name, 'v') && github.event.release.prerelease == false }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the released tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install packaging tools
        run: python -m pip install --disable-pip-version-check "build==1.6.0" "twine==7.0.0"

      - name: Build wheel and source distribution
        run: python -m build --sdist --wheel --outdir dist

      - name: Validate release identity and distributions
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          metadata = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          project = metadata["project"]
          version = project["version"]
          tag = os.environ["RELEASE_TAG"]
          if tag != f"v{version}":
              raise SystemExit(f"release tag {tag!r} does not match package version {version!r}")

          expected = sorted(
              [
                  f"agent_xplat-{version}-py3-none-any.whl",
                  f"agent_xplat-{version}.tar.gz",
              ]
          )
          actual = sorted(path.name for path in Path("dist").iterdir() if path.is_file())
          if actual != expected:
              raise SystemExit(f"unexpected distributions: {actual!r}; expected {expected!r}")
          if any(Path("dist", name).stat().st_size == 0 for name in actual):
              raise SystemExit("a distribution file is empty")
          print(f"validated {tag}: {', '.join(actual)}")
          PY

      - name: Validate package metadata and README rendering
        run: python -m twine check dist/*

      - name: Upload validated distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pypi-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to PyPI with Trusted Publishing
    needs: build
    if: ${{ startsWith(github.event.release.tag_name, 'v') && github.event.release.prerelease == false }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/agent-xplat
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pypi-distributions
          path: dist/

      - name: Set up Python for final validation
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install validation tool
        run: python -m pip install --disable-pip-version-check "twine==7.0.0"

      - name: Revalidate downloaded distributions
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          version = tag[1:]
          expected = sorted(
              [
                  f"agent_xplat-{version}-py3-none-any.whl",
                  f"agent_xplat-{version}.tar.gz",
              ]
          )
          actual = sorted(path.name for path in Path("dist").iterdir() if path.is_file())
          if actual != expected:
              raise SystemExit(f"downloaded distributions do not match {tag}: {actual!r}")
          PY
          python -m twine check dist/*

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
